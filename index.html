<!DOCTYPE html>

const montantRecu = 491475; // Montant de secours (utilisé seulement si montant.txt est illisible)
</script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progression de la Récolte - Objectif 70%</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">

    <script>
    /* ================= RÉGLAGES ÉCRAN =================
       ROTATION_HEURES : la disposition change toutes les X heures
                         (4 dispositions différentes, cycle complet = 4 × X heures)
       VEILLE          : écran quasi noir la nuit, ex. { debut: 23, fin: 4 }
                         (null = désactivé)
       LECTURE_MIN     : relit le fichier montant.txt toutes les X minutes
                         (le montant se met à jour sans recharger la page)
       RECHARGE_HEURES : recharge toute la page toutes les X heures
                         (utile seulement si tu modifies le design)
       Tests : ?layout=0..3 force une disposition, ?demo fait défiler les 4,
               ?displayQrCode affiche le QR code (comme avant)
    ==================================================== */
    const ROTATION_HEURES = 2;
    const VEILLE = null;
    const LECTURE_MIN = 5;
    const RECHARGE_HEURES = 6;
    </script>

    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-dark: #8A5A19;
            --text: #DCDCDC;
            --muted: #8892b0;
            --muted-2: #596585;
            --green: #55e06f;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: #000;
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            cursor: none;
        }

        /* ---------- Scène (dérive lente anti-marquage) ---------- */
        #stage {
            position: fixed;
            inset: 5vh 4vw;
            display: grid;
            grid-template-columns: 47fr 53fr;
            grid-template-rows: auto 1fr;
            grid-template-areas: "date date" "gauge info";
            column-gap: 3vw;
            transition: transform 40s ease-in-out, opacity 1.5s ease;
        }
        #stage.fade { opacity: 0; }

        /* 4 dispositions qui tournent */
        .layout-1 #stage, .layout-3 #stage {
            grid-template-columns: 53fr 47fr;
            grid-template-areas: "date date" "info gauge";
        }
        .layout-0 .info, .layout-3 .info { align-self: start; }
        .layout-1 .info, .layout-2 .info { align-self: end; }
        .layout-0 .date, .layout-2 .date { justify-self: start; }
        .layout-1 .date, .layout-3 .date { justify-self: end; }

        /* ---------- Date ---------- */
        .date {
            grid-area: date;
            font-family: 'Amiri', serif;
            font-size: 2.4vw;
            color: var(--gold);
            text-transform: capitalize;
            display: flex;
            align-items: center;
            gap: 1vw;
            margin-bottom: 2vh;
        }
        .date svg { width: 1.6vw; height: 1.6vw; }

        /* ---------- Jauge mosquée ---------- */
        .gauge {
            grid-area: gauge;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }
        .gauge > svg.mosque {
            width: 100%;
            height: 100%;
            max-height: 82vh;
            position: relative;
            z-index: 2;
            overflow: visible;
        }

        /* rosace géométrique très discrète qui tourne en fond */
        .rosette {
            position: absolute;
            width: 95vh;
            height: 95vh;
            left: 50%;
            top: 50%;
            margin: -47.5vh 0 0 -47.5vh;
            opacity: 0.09;
            z-index: 1;
            animation: spin 240s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .outline { fill: none; stroke: var(--gold); stroke-opacity: 0.45; stroke-width: 2; }
        .hole { fill: #000; stroke: var(--gold); stroke-opacity: 0.35; stroke-width: 1.5; }

        .wave { animation: wave 6s linear infinite; }
        .wave2 { animation: wave 9s linear infinite reverse; opacity: 0.45; }
        @keyframes wave { from { transform: translateX(0); } to { transform: translateX(-200px); } }

        .bubble {
            fill: var(--gold-light);
            opacity: 0;
            transform-box: fill-box;
            animation: rise 7s ease-in infinite;
        }
        @keyframes rise {
            0%   { transform: translateY(0); opacity: 0; }
            15%  { opacity: 0.8; }
            100% { transform: translateY(-260px); opacity: 0; }
        }

        .lvl-line { stroke: rgba(255,255,255,0.28); stroke-width: 1.5; stroke-dasharray: 6 6; }
        .lvl-text { fill: rgba(255,255,255,0.6); font: 700 22px 'Montserrat', sans-serif; }

        #line70 { stroke: var(--gold); stroke-width: 3; stroke-dasharray: none; animation: pulse-line 2s ease-in-out infinite; }
        #text70 { fill: #fff; font-size: 28px; }
        #label70 {
            fill: var(--gold-light);
            font: 800 14px 'Montserrat', sans-serif;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            animation: pulse-text 2s ease-in-out infinite;
        }
        @keyframes pulse-line { 50% { stroke: var(--gold-light); stroke-width: 4.5; } }
        @keyframes pulse-text { 50% { opacity: 0.55; } }

        #pctText { font: 800 50px 'Montserrat', sans-serif; letter-spacing: 1px; }

        /* ---------- Bloc infos ---------- */
        .info {
            grid-area: info;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 6vh 0 4vh;
        }
        .layout-1 .info, .layout-3 .info { align-items: flex-end; text-align: right; }

        /* cadre du texte (comme l'ancienne version) */
        .metric {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: inherit;
            background: rgba(255, 255, 255, 0.02);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .label {
            font-family: 'Amiri', serif;
            font-size: 2.8vw;
            color: var(--text);
            line-height: 1.2;
        }

        .ornament {
            display: flex;
            align-items: center;
            gap: 1vw;
            width: 60%;
            margin: 1.5vh 0 0.5vh;
        }
        .layout-1 .ornament, .layout-3 .ornament { flex-direction: row-reverse; }
        .ornament::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(212,175,55,0.6), rgba(212,175,55,0));
        }
        .layout-1 .ornament::after, .layout-3 .ornament::after {
            background: linear-gradient(270deg, rgba(212,175,55,0.6), rgba(212,175,55,0));
        }
        .ornament svg { width: 2vw; height: 2vw; animation: spin 30s linear infinite; }

        #montantRecu {
            font-weight: 800;
            font-size: 8.6vw;
            line-height: 1.05;
            letter-spacing: 0.2vw;
            white-space: nowrap;
            background: linear-gradient(100deg,
                var(--gold) 0%, var(--gold) 38%, #FFF6D5 50%, var(--gold) 62%, var(--gold) 100%);
            background-size: 300% 100%;
            background-position: 100% 0;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 14s ease-in-out infinite;
            filter: drop-shadow(0 0 2.2vw rgba(212,175,55,0.25));
        }
        #montantRecu .cur { font-size: 0.4em; letter-spacing: 0.1vw; margin-left: 0.6vw; }
        @keyframes shimmer {
            0%, 70% { background-position: 100% 0; }
            100%    { background-position: 0% 0; }
        }

        #objectif {
            font-size: 1.9vw;
            color: var(--muted);
            margin-top: 1.5vh;
        }
        .highlight-frais { font-size: 1.4vw; color: var(--muted-2); }

        /* mini-barre fine de rappel */
        .rail {
            width: 100%;
            height: 0.9vh;
            margin: 4vh 0 1vh;
            border-radius: 1vh;
            background: rgba(255,255,255,0.06);
            position: relative;
        }
        .rail-fill {
            height: 100%;
            width: 0;
            border-radius: 1vh;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-light));
            transition: width 3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .rail-tick {
            position: absolute;
            top: -0.8vh;
            bottom: -0.8vh;
            width: 2px;
            background: rgba(255,255,255,0.3);
        }
        .rail-tick.t70 { background: var(--gold); width: 3px; }

        #motivationTarget {
            margin-top: 3vh;
            font-size: 1.75vw;
            color: var(--text);
            background: rgba(212, 175, 55, 0.07);
            padding: 1.6vh 2.4vw;
            border-radius: 5vh;
            border: 1px solid rgba(212, 175, 55, 0.35);
            display: inline-block;
            line-height: 1.35;
            text-wrap: balance;
            max-width: 100%;
            font-weight: 500;
            animation: breathe 4s ease-in-out infinite;
        }
        #motivationTarget strong {
            color: var(--gold-light);
            font-size: 2.05vw;
            font-weight: 800;
        }
        @keyframes breathe {
            50% { border-color: rgba(243, 229, 171, 0.75); box-shadow: 0 0 2.5vw rgba(212,175,55,0.18); }
        }
        #motivationTarget.done {
            background: rgba(85, 224, 111, 0.1);
            border-color: rgba(85, 224, 111, 0.4);
            animation: none;
        }

        /* ---------- QR code (se déplace avec la disposition) ---------- */
        #qrcode {
            position: absolute;
            display: none;
            background: #eee;
            padding: 8px;
            border-radius: 10px;
            border: 2px solid var(--gold);
        }
        #qrcode.on { display: block; }
        #qrcode img { width: 100px; height: 100px; display: block; }
        .layout-0 #qrcode { right: 0; bottom: 0; }
        .layout-1 #qrcode { left: 0; top: 0; }
        .layout-2 #qrcode { right: 0; top: 0; }
        .layout-3 #qrcode { left: 0; bottom: 0; }

        /* ---------- Veille de nuit ---------- */
        #veille {
            position: fixed;
            inset: 0;
            background: #000;
            display: none;
            z-index: 100;
        }
        #veille span {
            position: absolute;
            font: 700 2vw 'Montserrat', sans-serif;
            color: rgba(212,175,55,0.35);
            transition: left 50s linear, top 50s linear;
        }
        body.night #veille { display: block; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
</head>

    <script>
        const montantTotal = 740000;
        const palierCible70 = montantTotal * 0.70; // 518'000 CHF

        function formatMontantSuisse(montant) {
            return Math.round(montant).toLocaleString('fr-CH').replace(/\s/g, "'");
        }

        const params = new URLSearchParams(window.location.search);

        const panelMotivation = document.getElementById('motivationTarget');
        const motivationInitiale = panelMotivation.innerHTML;
        const line70 = document.getElementById('line70');
        const label70 = document.getElementById('label70');
        const liquid = document.getElementById('liquid');
        const levelRect = document.getElementById('levelRect');
        const pctText = document.getElementById('pctText');
        const chiffre = document.getElementById('montantChiffre');
        const railFill = document.getElementById('railFill');

        /* ---------- Jauge : 0 % = y 500, 100 % = y 100 ---------- */
        let niveauActuel = 0;
        function setLevel(p) {
            niveauActuel = p;
            const y = 500 - p * 4;
            liquid.setAttribute('transform', `translate(0,${y})`);
            levelRect.setAttribute('y', y);
            levelRect.setAttribute('height', 500 - y);
            pctText.setAttribute('fill', y < 400 ? '#000' : '#D4AF37');
        }

        // fait monter (ou descendre) l'or lentement jusqu'au nouveau niveau
        function animerNiveau(cible, duree) {
            const depart = niveauActuel;
            const t0 = performance.now();
            const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
            railFill.style.transition = `width ${duree}ms ease-in-out`;
            railFill.style.width = `${cible}%`;
            function frame(now) {
                const t = Math.min((now - t0) / duree, 1);
                setLevel(depart + (cible - depart) * ease(t));
                if (t < 1) requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
        }

        /* ---------- Affichage d'un montant ---------- */
        let montantAffiche = null;
        function afficher(montant) {
            if (montant === montantAffiche) return;
            const premier = montantAffiche === null;
            montantAffiche = montant;
            const pct = Math.min((montant / montantTotal) * 100, 100);

            chiffre.textContent = formatMontantSuisse(montant);
            pctText.textContent = `${pct.toFixed(1)}%`;
            document.getElementById('veilleTxt').textContent = `${formatMontantSuisse(montant)} CHF`;

            if (montant < palierCible70) {
                panelMotivation.innerHTML = motivationInitiale;
                panelMotivation.classList.remove('done');
                document.getElementById('manquantTarget').textContent = `${formatMontantSuisse(palierCible70 - montant)} CHF`;
                line70.style.animation = ''; line70.style.stroke = '';
                label70.style.animation = ''; label70.style.fill = '';
                label70.textContent = 'Prochain Objectif !';
            } else {
                panelMotivation.innerHTML = "🎉 <strong>Objectif 70% Atteint !</strong> Al Hamdulillah. Continuons l'effort !";
                panelMotivation.classList.add('done');
                line70.style.animation = 'none'; line70.style.stroke = '#55e06f';
                label70.style.animation = 'none'; label70.style.fill = '#55e06f';
                label70.textContent = 'Objectif Atteint !';
            }

            if (premier) {
                setLevel(0);
                setTimeout(() => animerNiveau(pct, 6000), 800);   // remplissage lent au démarrage
            } else {
                animerNiveau(pct, 4000);                          // nouveau montant : l'or monte doucement
            }
        }

        /* ---------- Lecture de montant.txt ---------- */
        // le fichier contient juste le montant, ex. 491475 (491'475 est accepté aussi)
        function lireMontant() {
            return fetch(`montant.txt?t=${Date.now()}`, { cache: 'no-store' })
                .then(r => r.ok ? r.text() : Promise.reject())
                .then(txt => {
                    const n = parseInt(txt.replace(/[^0-9]/g, ''), 10);
                    if (Number.isFinite(n) && n > 0) afficher(n);
                    else if (montantAffiche === null) afficher(montantRecu);
                })
                .catch(() => { if (montantAffiche === null) afficher(montantRecu); });
        }
        lireMontant();
        setInterval(lireMontant, LECTURE_MIN * 60 * 1000);

        /* ---------- Date ---------- */
        function majDate() {
            document.getElementById('currentDate').textContent =
                new Date().toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        majDate();
        setInterval(majDate, 60 * 1000);

        /* ---------- Anti-marquage : rotation des dispositions ---------- */
        const stage = document.getElementById('stage');
        let layoutActuel = -1;

        function layoutPourMaintenant() {
            if (params.has('layout')) return (parseInt(params.get('layout'), 10) || 0) % 4;
            const periode = params.has('demo') ? 8000 : ROTATION_HEURES * 3600 * 1000;
            return Math.floor(Date.now() / periode) % 4;
        }

        function appliquerLayout(force) {
            const l = layoutPourMaintenant();
            if (l === layoutActuel && !force) return;
            const premier = layoutActuel === -1;
            layoutActuel = l;
            if (premier) { document.body.className = `layout-${l}`; return; }
            stage.classList.add('fade');
            setTimeout(() => {
                document.body.className = `layout-${l}`;
                stage.classList.remove('fade');
            }, 1600);
        }
        appliquerLayout();
        setInterval(appliquerLayout, params.has('demo') ? 1000 : 30 * 1000);

        // micro-dérive permanente de toute la scène (quelques pixels, très lente)
        function deriver() {
            const t = Date.now() / 60000;
            const dx = Math.sin(t * 0.7) * 1.2;   // en vw
            const dy = Math.cos(t * 0.53) * 1.2;  // en vh
            stage.style.transform = `translate(${dx}vw, ${dy}vh)`;
        }
        deriver();
        setInterval(deriver, 40 * 1000);

        /* ---------- Veille de nuit (optionnelle) ---------- */
        function estLaNuit() {
            if (!VEILLE) return false;
            const h = new Date().getHours();
            return VEILLE.debut > VEILLE.fin
                ? (h >= VEILLE.debut || h < VEILLE.fin)
                : (h >= VEILLE.debut && h < VEILLE.fin);
        }
        function majVeille() {
            document.body.classList.toggle('night', estLaNuit());
            const s = document.getElementById('veilleTxt');
            s.style.left = `${5 + Math.random() * 75}vw`;
            s.style.top = `${5 + Math.random() * 85}vh`;
        }
        majVeille();
        setInterval(majVeille, 60 * 1000);

        /* ---------- Rechargement complet (si le design change) ---------- */
        // ne recharge que si le site répond, pour ne jamais afficher une page d'erreur
        setInterval(() => {
            fetch(window.location.href, { cache: 'no-store' })
                .then(r => { if (r.ok) window.location.reload(); })
                .catch(() => {});
        }, RECHARGE_HEURES * 3600 * 1000);

        /* ---------- QR code ---------- */
        if (params.has('displayQrCode') && typeof qrcode !== 'undefined') {
            const qr = qrcode(0, 'L');
            qr.addData('https://docs.google.com/forms/d/e/1FAIpQLSc7BlKx-n79_-pOm46anvRlnRTNFY37br7CZTgdKmvE-VHM3Q/viewform');
            qr.make();
            const el = document.getElementById('qrcode');
            el.innerHTML = qr.createImgTag(4);
            el.classList.add('on');
        }
    </script>
</body>
</html>
